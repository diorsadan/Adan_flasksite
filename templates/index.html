{% extends 'base.html' %}

{% block content %}
<h1>Items</h1>

<ul class="list-group mb-3">
{% for item in items %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
        <span>{{ item.name }}</span>
        <div>
            <a href="{{ url_for('update', idNum=item.idNum) }}" class="btn btn-sm btn-outline-primary">Edit</a>
            <form method="POST" action="{{ url_for('delete', idNum=item.idNum) }}" style="display:inline;">
                <button type="submit" class="btn btn-sm btn-outline-danger ms-1">Delete</button>
            </form>
        </div>
    </li>
{% endfor %}
</ul>

<a href="{{ url_for('create') }}" class="btn btn-primary">Add new item</a>
{% endblock %}
